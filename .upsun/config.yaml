# Upsun configuration for Pulse.
# Three runtime surfaces: web (static React build), api (FastAPI), and the
# queue worker (same image as api, different start command).
# Every branch gets a preview environment with its own PostgreSQL and Redis.

applications:
  api:
    type: "python:3.12"
    source:
      root: apps/api

    relationships:
      postgresql:
        service: postgresql
        endpoint: postgresql
      # MariaDB. No app code consumes it yet; the relationship exists so
      # it's reachable over SSH and MARIADB_URL is exported by
      # apps/api/.environment.
      mariadb:
        service: mariadb
        endpoint: mysql
      redis:

    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -e
        export UV_CACHE_DIR="$PLATFORM_CACHE_DIR/uv"
        uv sync --frozen --no-dev
      deploy: |
        set -e
        .venv/bin/alembic upgrade head

    web:
      commands:
        start: ".venv/bin/uvicorn pulse.main:app --host 0.0.0.0 --port $PORT"

    workers:
      queue:
        commands:
          start: ".venv/bin/arq pulse.worker.WorkerSettings"

    crons:
      # Enqueues the rollup; the queue worker executes it. Stale-issue
      # detection is scheduled inside the worker itself (ARQ cron_jobs).
      daily-rollup:
        spec: "H 3 * * *"
        commands:
          start: ".venv/bin/python -m pulse.jobs.enqueue_rollup"

  web:
    type: "nodejs:24"
    source:
      root: apps/web

    build:
      flavor: none

    hooks:
      build: |
        set -e
        npm ci
        npm run build

    web:
      commands:
        start: sleep infinity
      locations:
        "/":
          root: "dist"
          index: ["index.html"]
          passthru: "/index.html"
          expires: 5m
          rules:
            \.(js|css|svg|woff2?)$:
              expires: 1y

services:
  postgresql:
    type: "postgresql:17"
    configuration:
      databases:
        - main
      endpoints:
        postgresql:
          default_database: main
          privileges:
            main: admin
  mariadb:
    type: "mariadb:11.4"
    configuration:
      schemas:
        - main
      endpoints:
        mysql:
          default_schema: main
          privileges:
            main: admin
  redis:
    type: "redis-persistent:7.2"

routes:
  "https://{default}/":
    type: upstream
    upstream: "web:http"
  "https://{default}/api":
    type: upstream
    upstream: "api:http"
    cache:
      enabled: false

# Upsun Cloud performance agent. Run it against `api` or `queue` (not `web`,
# which is a static build). Needs the env:ANTHROPIC_API_KEY sensitive project
# variable. See docs/performance-agent.md.
tasks:
  performance-agent:
    base: "performance-agent"
